<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Bobo's Kitchen</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="CSS file/style.css">

</head>


<body>

<header class="site-header">

    <div class="header-container">

        <h1 class="logo">
            Bobo's Kitchen
        </h1>


        <nav class="navbar">

            <a href="index.html">Home</a>

            <a href="order.html">Order</a>

            <a href="contact.html">Contact</a>

            <a href="login.html" class="active">Login</a>

        </nav>

    </div>

</header>


<main>

    <section class="form-section">

        <div class="form-card">

            <h2 class="page-title">
                Staff Login
            </h2>

            <p class="section-intro">
                Login to access your Bobo's Kitchen account.
            </p>


            <!-- LOGIN FORM -->

            <form
                class="main-form"
                action="PHP/login.php"
                method="POST"
            >

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >


                <label for="role">
                    Role
                </label>

                <select
                    id="role"
                    name="role"
                    required
                >

                    <option value="">
                        Select your role
                    </option>

                    <option value="employee">
                        Employee
                    </option>

                    <option value="employer">
                        Employer
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                </select>


                <button
                    type="submit"
                    class="btn"
                >
                    Login
                </button>

            </form>


            <div class="form-link">

                <p>
                    Don't have an account?

                    <a href="signup.html">
                        Sign Up Here
                    </a>
                </p>

            </div>

        </div>

    </section>

</main>


<footer class="site-footer">

    <p>
        © 2026 Bobo's Kitchen. All Rights Reserved.
    </p>

</footer>

<script src="Javascript/script.js"></script>

</body>

</html>
