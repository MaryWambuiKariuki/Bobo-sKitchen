<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Staff Sign Up - Bobo's Kitchen</title>


    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">


    <link rel="stylesheet" href="CSS file/style.css">

</head>


<body>

<header class="site-header">

    <div class="header-container">

        <h1 class="logo">
            Bobo's Kitchen
        </h1>


        <nav class="navbar">

            <a href="index.html">
                Home
            </a>

            <a href="order.html">
                Order
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="login.html">
                Staff Login
            </a>

        </nav>


        <button id="themeToggle"
                class="theme-button">

            🌙 Dark Mode

        </button>

    </div>

</header>


<main>

    <section class="form-section">

        <div class="form-card">

            <h2 class="page-title">
                Staff Sign Up
            </h2>


            <p class="section-intro">

                Create an account before logging
                into the staff system.

            </p>


            <form id="signupForm"
                  action="PHP/signup.php"
                  method="POST">


                <label for="fullName">
                    Full Name:
                </label>

                <input type="text"
                       id="fullName"
                       name="fullName"
                       required>


                <label for="newUsername">
                    Username:
                </label>

                <input type="text"
                       id="newUsername"
                       name="username"
                       required>


                <label for="newPassword">
                    Password:
                </label>

                <input type="password"
                       id="newPassword"
                       name="password"
                       required>


                <label for="confirmPassword">
                    Confirm Password:
                </label>

                <input type="password"
                       id="confirmPassword"
                       name="confirmPassword"
                       required>


                <label for="signupRole">
                    Role:
                </label>

                <select id="signupRole"
                        name="role"
                        required>

                    <option value="">
                        -- Select Role --
                    </option>

                    <option value="employee">
                        Employee
                    </option>

                    <option value="employer">
                        Employer
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                </select>


                <button type="submit"
                        class="btn">

                    Sign Up

                </button>

            </form>


            <p class="form-link">

                Already have an account?

                <a href="login.html">
                    Login Here
                </a>

            </p>

        </div>

    </section>

</main>


<footer class="site-footer">

    <p>
        © 2026 Bobo's Kitchen.
        All Rights Reserved.
    </p>

</footer>


<script src="Javascript/script.js"></script>

</body>

</html>
