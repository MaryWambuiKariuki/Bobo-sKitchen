<section class="form-section">

    <div class="form-card">

        <h2 class="page-title">
            Place Your Order
        </h2>

        <p class="section-intro">
            Enjoy your meal at Bobo's Kitchen.
            Please enter your table number below.
        </p>


        <form
            class="main-form"
            action="PHP/save_order.php"
            method="POST"
        >

            <label for="customer_name">
                Customer Name
            </label>

            <input
                type="text"
                id="customer_name"
                name="customer_name"
                required
            >


            <label for="table_number">
                Table Number
            </label>

            <input
                type="number"
                id="table_number"
                name="table_number"
                min="1"
                required
            >


            <label for="food_item">
                Select Food
            </label>

            <select
                id="food_item"
                name="food_item"
                required
            >

                <option value="">
                    Select a food item
                </option>

                <option value="Burger">
                    Burger - Ksh 450
                </option>

                <option value="Pizza">
                    Pizza - Ksh 850
                </option>

                <option value="French Fries">
                    French Fries - Ksh 250
                </option>

                <option value="Steak">
                    Steak - Ksh 1200
                </option>

                <option value="Chicken">
                    Chicken - Ksh 750
                </option>

                <option value="Pasta">
                    Pasta - Ksh 650
                </option>

            </select>


            <label for="quantity">
                Quantity
            </label>

            <input
                type="number"
                id="quantity"
                name="quantity"
                min="1"
                value="1"
                required
            >


            <label for="special_instructions">
                Special Instructions
            </label>

            <textarea
                id="special_instructions"
                name="special_instructions"
                rows="5"
                placeholder="Any special requests?"
            ></textarea>


            <button
                type="submit"
                class="btn"
            >
                Place Order
            </button>

        </form>

    </div>

    <script src="Javascript/script.js"></script>

</section>
